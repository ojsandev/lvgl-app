name: Release
# Native installers: AppImage, DMG and Windows installer.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: macos-arm64
            os: macos-15
          - name: windows-x86_64
            os: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          pip install conan

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-14 \
            g++-14 \
            cmake \
            ninja-build \
            pkg-config \
            libssl-dev \
            libsdl2-dev \
            uuid-dev

      - name: Configure GCC 14
        if: runner.os == 'Linux'
        run: |
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja openssl@3 sdl2

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja cmake -y

      - name: Configure Conan
        shell: bash
        run: |
          conan profile detect --force

      - name: Install Conan dependencies
        shell: bash
        run: |
          conan install . \
            -of=build/release \
            -s build_type=Release \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=true \
            --build=missing

      - name: Configure CMake
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake --preset release-windows
          else
            cmake --preset release
          fi

      - name: Build application
        shell: bash
        run: |
          cmake --build build/release \
            --config Release \
            --target my-lvgl-app \
            -j 4

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3

      - name: Install macOS packaging tools
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg

      - name: Install Windows packaging tool
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/release-linux.sh

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: my-lvgl-app-*-linux-x86_64.AppImage

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/release-macos.sh

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: my-lvgl-app-*-macos-arm64.dmg

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/release-windows.ps1

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*-installer.exe

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/**/*.AppImage
            release/**/*.dmg
            release/**/*-installer.exe
