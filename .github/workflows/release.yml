name: Release
# Native installers: AppImage, DMG and Windows installer.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: macos-arm64
            os: macos-15
          - name: windows-x86_64
            os: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          pip install conan

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-14 \
            g++-14 \
            cmake \
            ninja-build \
            pkg-config \
            libssl-dev \
            libsdl2-dev \
            uuid-dev

      - name: Configure GCC 14
        if: runner.os == 'Linux'
        run: |
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja openssl@3 sdl2

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja cmake -y

      - name: Configure Conan
        shell: bash
        run: |
          conan profile detect --force

      - name: Install Conan dependencies
        shell: bash
        run: |
          conan install . \
            -of=build/release \
            -s build_type=Release \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=true \
            --build=missing

      - name: Configure CMake
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake --preset release-windows
          else
            cmake --preset release
          fi

      - name: Build application
        shell: bash
        run: |
          cmake --build build/release \
            --config Release \
            --target my-lvgl-app \
            -j 4

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3

      - name: Install macOS packaging tools
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg

      - name: Install Windows packaging tool
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          APPDIR="$PWD/AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib"
          cp build/release/my-lvgl-app "$APPDIR/usr/bin/my-lvgl-app"

          while IFS= read -r lib; do
            [[ -f "$lib" ]] || continue
            case "$lib" in
              */libSDL2*.so*|*/libssl*.so*|*/libcrypto*.so*) cp -L "$lib" "$APPDIR/usr/lib/" ;;
            esac
          done < <(ldd "$APPDIR/usr/bin/my-lvgl-app" | awk '{print $3}' | grep '^/' | sort -u)

          cat > "$APPDIR/AppRun" <<'EOF'
#!/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          export LD_LIBRARY_PATH="$HERE/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/usr/bin/my-lvgl-app" "$@"
EOF
          chmod +x "$APPDIR/AppRun"

          cat > "$APPDIR/my-lvgl-app.desktop" <<'EOF'
[Desktop Entry]
Type=Application
Name=my-lvgl-app
Exec=my-lvgl-app
Terminal=false
Categories=Utility;
EOF

          curl -L --fail -o appimagetool https://github.com/AppImage/appimagetool/releases/latest/download/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool "$APPDIR" "my-lvgl-app-${GITHUB_REF_NAME}-linux-x86_64.AppImage"

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist "my-lvgl-app-${GITHUB_REF_NAME}-macos-arm64.dmg"
          APP="dist/my-lvgl-app.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Frameworks"
          cp build/release/my-lvgl-app "$APP/Contents/MacOS/my-lvgl-app"
          chmod +x "$APP/Contents/MacOS/my-lvgl-app"
          cat > "$APP/Contents/Info.plist" <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0"><dict>
<key>CFBundleExecutable</key><string>my-lvgl-app</string>
<key>CFBundleIdentifier</key><string>com.ojsandev.my-lvgl-app</string>
<key>CFBundleName</key><string>my-lvgl-app</string>
<key>CFBundlePackageType</key><string>APPL</string>
<key>CFBundleVersion</key><string>${GITHUB_REF_NAME#v}</string>
<key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>
</dict></plist>
EOF
          SDL2_LIB="$(find "$(brew --prefix sdl2)/lib" -maxdepth 1 -name 'libSDL2*.dylib' | head -n 1)"
          SSL_LIB="$(find "$(brew --prefix openssl@3)/lib" -maxdepth 1 -name 'libssl*.dylib' | head -n 1)"
          CRYPTO_LIB="$(find "$(brew --prefix openssl@3)/lib" -maxdepth 1 -name 'libcrypto*.dylib' | head -n 1)"
          for lib in "$SDL2_LIB" "$SSL_LIB" "$CRYPTO_LIB"; do
            [[ -f "$lib" ]] || continue
            cp -L "$lib" "$APP/Contents/Frameworks/"
            base="$(basename "$lib")"
            install_name_tool -change "$lib" "@loader_path/../Frameworks/$base" "$APP/Contents/MacOS/my-lvgl-app" || true
          done
          mkdir -p dist/dmg-root
          cp -R "$APP" dist/dmg-root/
          create-dmg --volname "my-lvgl-app" --window-size 600 400 --app-drop-link 450 200 "my-lvgl-app-${GITHUB_REF_NAME}-macos-arm64.dmg" dist/dmg-root/
      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $exe = "build/release/Release/my-lvgl-app.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $iss = @"
#define MyAppVersion "$version"
[Setup]
AppId={{B19E6B4B-91AD-4B0C-9A34-0F55A6E0B5D6}
AppName=my-lvgl-app
AppVersion={#MyAppVersion}
DefaultDirName={autopf}\my-lvgl-app
DisableProgramGroupPage=yes
OutputDir=dist
OutputBaseFilename=my-lvgl-app-$env:GITHUB_REF_NAME-windows-x86_64-installer
ArchitecturesAllowed=x64compatible
ArchitecturesInstallIn64BitMode=x64compatible
[Files]
Source: "$exe"; DestDir: "{app}"; Flags: ignoreversion
[Icons]
Name: "{autoprograms}\my-lvgl-app"; Filename: "{app}\my-lvgl-app.exe"
Name: "{autodesktop}\my-lvgl-app"; Filename: "{app}\my-lvgl-app.exe"
[Run]
Filename: "{app}\my-lvgl-app.exe"; Description: "Launch my-lvgl-app"; Flags: nowait postinstall skipifsilent
"@
          Set-Content -Path installer.iss -Value $iss -Encoding UTF8
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" installer.iss
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/**/*.AppImage
            release/**/*.dmg
            release/**/*-installer.exe
