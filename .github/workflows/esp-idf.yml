name: ESP-IDF Firmware

on:
  push:
    paths:
      - 'esp32/**'
      - 'app/ui/**'
      - 'app/utils/**'
      - 'common/**'
      - 'domain/**'
      - 'infra/display/**'
      - 'lv_conf.h'
      - '.github/workflows/esp-idf.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'esp32/**'
      - 'app/ui/**'
      - 'app/utils/**'
      - 'common/**'
      - 'domain/**'
      - 'infra/display/**'
      - 'lv_conf.h'
      - '.github/workflows/esp-idf.yml'
  workflow_dispatch:

concurrency:
  group: esp-idf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-firmware:
    name: Build ESP32-S3 firmware (ESP-IDF 5.5.5)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.5

      - name: Select ESP32-S3 target
        working-directory: esp32
        run: idf.py set-target esp32s3

      - name: Build firmware
        working-directory: esp32
        run: idf.py build
