name: Build

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          pip install conan

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libssl-dev \
            libsdl2-dev \
            uuid-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja openssl@3 sdl2

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja cmake -y

      - name: Detect compiler
        shell: bash
        run: |
          cmake --version
          ninja --version
          conan --version

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "Running on Windows"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "Running on macOS"
          else
            echo "Running on Linux"
          fi

      - name: Configure Conan
        shell: bash
        run: |
          conan profile detect --force

      - name: Conan environment
        shell: bash
        run: |
          echo "=== Conan ==="
          conan --version
          
          echo "=== Conan profile ==="
          conan profile show
          
          echo "=== Conan remotes ==="
          conan remote list    

      - name: Inspect Conan graph
        shell: bash
        run: |
          conan graph info . \
            -s build_type=Debug \
            --format=json > conan-graph.json
          
          echo "=== OpenSSL references ==="
          grep -n -i "openssl" conan-graph.json || true
          
          echo "=== Conan graph ==="
          cat conan-graph.json

      - name: Install Conan dependencies
        shell: bash
        run: |
          conan install . \
            -of=build/debug \
            -s build_type=Debug \
            --build=missing

      - name: Configure CMake
        shell: bash
        run: |
          cmake --preset debug

      - name: Build TLS test
        shell: bash
        run: |
          cmake --build build/debug \
            --target tls-test \
            -j 4

      - name: Run TLS test
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./build/debug/tls-test.exe
          else
            ./build/debug/tls-test
          fi
